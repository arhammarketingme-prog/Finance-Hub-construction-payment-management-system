<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Hub — Dashboard</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/supabase-config.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="appHeader"></header>

    <main class="page">
      <div class="page-title">Dashboard</div>

      <div class="quick-actions">
        <a class="quick-action" href="client-payments.html?new=1"><span class="icon">₹</span>Client Receipt</a>
        <a class="quick-action" href="supplier-expenses.html?new=1"><span class="icon">⇩</span>Expense</a>
        <a class="quick-action" href="contractor-payments.html?new=1"><span class="icon">⚒</span>Contractor</a>
        <a class="quick-action" href="labour-payments.html?new=1"><span class="icon">⛏</span>Labour</a>
        <a class="quick-action" href="self-expenses.html?new=1"><span class="icon">◍</span>Self</a>
        <a class="quick-action" href="reports.html"><span class="icon">▤</span>Reports</a>
      </div>

      <div class="summary-grid" id="summaryGrid">
        <div class="summary-card receipts"><div class="label">Client Receipts</div><div class="value">…</div></div>
        <div class="summary-card expenses"><div class="label">Expenses</div><div class="value">…</div></div>
        <div class="summary-card contractor"><div class="label">Contractor</div><div class="value">…</div></div>
        <div class="summary-card labour"><div class="label">Labour</div><div class="value">…</div></div>
        <div class="summary-card"><div class="label">Cash Balance</div><div class="value">…</div></div>
        <div class="summary-card"><div class="label">Online Balance</div><div class="value">…</div></div>
      </div>

      <div class="card">
        <div class="flex between center">
          <div class="section-label" style="margin:0;">GST Summary</div>
        </div>
        <div id="gstSummary" class="text-sm text-muted">Loading…</div>
      </div>

      <div class="section-label">Site-wise Summary</div>
      <div class="card" id="siteSummary"><div class="text-sm text-muted">Loading…</div></div>

      <div class="section-label">Recent Transactions</div>
      <div class="card" id="recentTxns"><div class="text-sm text-muted">Loading…</div></div>
    </main>

    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <script type="module">
    import { requireAuth, supabase, renderChrome, currentSiteId, getSites, formatINR, formatDate } from './assets/app.js';

    (async () => {
      const auth = await requireAuth();
      if (!auth) return;
      await renderChrome({ activeNav: 'dashboard' });

      const siteId = currentSiteId();
      const rpcSiteId = siteId === 'all' ? null : siteId;

      const { data: sum, error: sumErr } = await supabase.rpc('dashboard_summary', { p_site_id: rpcSiteId });
      const s = (sum && sum[0]) || {
        client_total: 0, client_cash: 0, client_online: 0, gst_total: 0,
        expense_total: 0, expense_cash: 0, expense_online: 0,
        contractor_total: 0, contractor_cash: 0, contractor_online: 0,
        labour_total: 0, labour_cash: 0, labour_online: 0
      };
      if (sumErr) console.error(sumErr);

      const grid = document.getElementById('summaryGrid');
      const cashTotal = Number(s.client_cash) - Number(s.expense_cash) - Number(s.contractor_cash) - Number(s.labour_cash);
      const onlineTotal = Number(s.client_online) - Number(s.expense_online) - Number(s.contractor_online) - Number(s.labour_online);
      grid.innerHTML = `
        <div class="summary-card receipts"><div class="label">Client Receipts</div><div class="value">${formatINR(s.client_total)}</div></div>
        <div class="summary-card expenses"><div class="label">Expenses</div><div class="value">${formatINR(s.expense_total)}</div></div>
        <div class="summary-card contractor"><div class="label">Contractor</div><div class="value">${formatINR(s.contractor_total)}</div></div>
        <div class="summary-card labour"><div class="label">Labour</div><div class="value">${formatINR(s.labour_total)}</div></div>
        <div class="summary-card"><div class="label">Cash Balance</div><div class="value">${formatINR(cashTotal)}</div></div>
        <div class="summary-card"><div class="label">Online Balance</div><div class="value">${formatINR(onlineTotal)}</div></div>
      `;

      document.getElementById('gstSummary').innerHTML =
        `<div class="flex between"><span>GST collected (client receipts)</span><strong>${formatINR(s.gst_total)}</strong></div>`;

      // Site-wise summary (computed in the DB, so it's accurate no matter how many rows exist)
      const { data: siteRows, error: siteErr } = await supabase.rpc('site_summary');
      if (siteErr) console.error(siteErr);
      document.getElementById('siteSummary').innerHTML = (siteRows && siteRows.length)
        ? siteRows.map(r => `
          <div class="flex between" style="padding:6px 0;">
            <span class="site-tag">${r.site_name}</span>
            <span class="text-sm"><span style="color:var(--receipt)">${formatINR(r.total_receipts)}</span> · <span style="color:var(--expense)">${formatINR(r.total_expenses)}</span></span>
          </div>`).join('')
        : '<div class="text-sm text-muted">No sites yet.</div>';

      // Recent transactions (merged, most recent 8)
      let rt = supabase.from('client_payments').select('id, client_name, amount, payment_date, payment_mode, site_id').eq('status', 'active').order('payment_date', { ascending: false }).limit(8);
      if (rpcSiteId) rt = rt.eq('site_id', rpcSiteId);
      const { data: recent } = await rt;
      const recentEl = document.getElementById('recentTxns');
      if (!recent || recent.length === 0) {
        recentEl.innerHTML = `<div class="empty-state"><span class="icon">▤</span><div class="title">No transactions yet</div><div>Add your first entry from Quick Actions above.</div></div>`;
      } else {
        recentEl.innerHTML = recent.map(t => `
          <div class="txn-row">
            <div class="txn-main">
              <div class="txn-party">${t.client_name}</div>
              <div class="txn-meta"><span class="chip ${t.payment_mode.toLowerCase()}">${t.payment_mode}</span>${formatDate(t.payment_date)}</div>
            </div>
            <div class="txn-amount"><div class="amt credit">${formatINR(t.amount)}</div></div>
          </div>`).join('');
      }
    })();
  </script>
</body>
</html>
