<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Hub — Contractor Payments</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/supabase-config.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="appHeader"></header>
    <main class="page">
      <div class="flex between center">
        <div class="page-title">Contractor Payments</div>
        <button class="btn btn-primary btn-sm" id="toggleFormBtn">+ New</button>
      </div>
      <div class="subnav-strip" id="subNav"></div>
      <div id="banner" class="banner hidden"></div>

      <form id="payForm" class="card hidden">
        <div class="field"><label for="partyName">Contractor</label><input type="text" id="partyName" list="partyList" required><datalist id="partyList"></datalist></div>
        <div class="field"><label for="siteSel">Site</label><select id="siteSel" required></select></div>
        <div class="field"><label for="payDate">Payment date</label><input type="date" id="payDate" required></div>
        <div class="field"><label for="amount">Amount</label><input type="number" id="amount" min="0.01" step="0.01" required></div>
        <div class="field">
          <label>Payment mode</label>
          <div class="mode-toggle">
            <label><input type="radio" name="paymentMode" value="Cash" checked><span>Cash</span></label>
            <label><input type="radio" name="paymentMode" value="Online"><span>Online</span></label>
          </div>
        </div>
        <div class="field">
          <label>Status</label>
          <div class="mode-toggle">
            <label><input type="radio" name="payStatus" value="Paid" checked><span>Paid</span></label>
            <label><input type="radio" name="payStatus" value="Pending"><span>Pending</span></label>
          </div>
        </div>
        <div class="field"><label for="remarks">Remarks</label><textarea id="remarks" rows="2"></textarea></div>
        <div class="field"><label for="attachments">Attachment</label><input type="file" id="attachments" multiple accept=".pdf,.jpg,.jpeg,.png"></div>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Payment</button>
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
        </div>
      </form>

      <div class="search-bar"><input type="search" id="searchBox" placeholder="Search contractor…"></div>
      <div class="filter-row">
        <select id="filterSite"><option value="">All sites</option></select>
        <select id="filterMode"><option value="">Any mode</option><option value="Cash">Cash</option><option value="Online">Online</option></select>
      </div>
      <div class="card" id="listCard"><div class="text-sm text-muted">Loading…</div></div>
    </main>
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <script type="module">
    import {
      requireAuth, supabase, renderChrome, renderSubNav, currentSiteId, getSites,
      formatINR, formatDate, todayISO, showBanner, debounce, logAudit, findOrCreateParty, archiveRecord
    } from './assets/app.js';

    const TABLE = 'contractor_payments';
    const PARTY_TYPE = 'Contractor';
    let auth, sites;

    (async () => {
      auth = await requireAuth(); if (!auth) return;
      await renderChrome({ activeNav: 'transactions' });
      renderSubNav('contractor');
      sites = await getSites();
      document.getElementById('siteSel').innerHTML = sites.map(s => `<option value="${s.id}">${s.site_name}</option>`).join('');
      document.getElementById('filterSite').innerHTML += sites.map(s => `<option value="${s.id}">${s.site_name}</option>`).join('');
      document.getElementById('payDate').value = todayISO();

      const form = document.getElementById('payForm');
      const toggleBtn = document.getElementById('toggleFormBtn');
      const openForm = () => { form.classList.remove('hidden'); toggleBtn.classList.add('hidden'); };
      toggleBtn.addEventListener('click', openForm);
      document.getElementById('cancelBtn').addEventListener('click', () => { form.classList.add('hidden'); toggleBtn.classList.remove('hidden'); form.reset(); });
      if (new URLSearchParams(location.search).get('new') === '1') openForm();

      const partyInput = document.getElementById('partyName');
      partyInput.addEventListener('input', debounce(async () => {
        const { data } = await supabase.from('parties').select('party_name').eq('party_type', PARTY_TYPE).ilike('party_name', `%${partyInput.value}%`).limit(10);
        document.getElementById('partyList').innerHTML = (data || []).map(p => `<option value="${p.party_name}">`).join('');
      }, 250));

      const banner = document.getElementById('banner');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('saveBtn'); saveBtn.disabled = true;
        try {
          const name = partyInput.value.trim();
          const amount = parseFloat(document.getElementById('amount').value);
          if (!name) throw new Error('Contractor name is required.');
          if (!(amount > 0)) throw new Error('Amount must be greater than zero.');
          const party = await findOrCreateParty(name, PARTY_TYPE);
          const payload = {
            contractor_id: party?.id || null,
            contractor_name_snapshot: name,
            site_id: document.getElementById('siteSel').value,
            payment_date: document.getElementById('payDate').value,
            amount,
            payment_mode: document.querySelector('input[name="paymentMode"]:checked').value,
            payment_status: document.querySelector('input[name="payStatus"]:checked').value,
            remarks: document.getElementById('remarks').value.trim() || null,
            created_by: auth.profile.id,
          };
          const { data: inserted, error } = await supabase.from(TABLE).insert(payload).select().single();
          if (error) throw error;
          const files = document.getElementById('attachments').files;
          for (const file of files) {
            const path = `${TABLE}/${inserted.id}/${Date.now()}_${file.name}`;
            const { error: upErr } = await supabase.storage.from('attachments').upload(path, file);
            if (!upErr) await supabase.from('attachments').insert({
              transaction_table: TABLE, transaction_id: inserted.id,
              file_path: path, file_name: file.name, file_type: file.type, uploaded_by: auth.profile.id
            });
          }
          await logAudit('create', TABLE, inserted.id, { amount, contractor: name });
          showBanner(banner, 'Saved — contractor payment recorded', 'success');
          form.reset(); document.getElementById('payDate').value = todayISO();
          form.classList.add('hidden'); toggleBtn.classList.remove('hidden');
          loadList();
        } catch (err) {
          showBanner(banner, err.message || 'Could not save payment.', 'error');
        } finally { saveBtn.disabled = false; }
      });

      async function loadList() {
        const listCard = document.getElementById('listCard');
        let q = supabase.from(TABLE).select('*').eq('status', 'active').order('payment_date', { ascending: false }).limit(100);
        const siteId = currentSiteId(); if (siteId !== 'all') q = q.eq('site_id', siteId);
        const fSite = document.getElementById('filterSite').value; if (fSite) q = q.eq('site_id', fSite);
        const fMode = document.getElementById('filterMode').value; if (fMode) q = q.eq('payment_mode', fMode);
        const search = document.getElementById('searchBox').value.trim();
        if (search) q = q.ilike('contractor_name_snapshot', `%${search}%`);
        const { data, error } = await q;
        if (error) { listCard.innerHTML = `<div class="text-sm" style="color:var(--expense)">${error.message}</div>`; return; }
        if (!data || data.length === 0) {
          listCard.innerHTML = `<div class="empty-state"><span class="icon">⚒</span><div class="title">No contractor payments found</div><div>Adjust filters or add a new payment.</div></div>`;
          return;
        }
        const siteMap = Object.fromEntries(sites.map(s => [s.id, s.site_name]));
        listCard.innerHTML = data.map(t => `
          <div class="txn-row">
            <div class="txn-main">
              <div class="txn-party">${t.contractor_name_snapshot}</div>
              <div class="txn-meta">
                <span class="site-tag">${siteMap[t.site_id] || ''}</span>
                <span class="chip ${t.payment_mode.toLowerCase()}">${t.payment_mode}</span>
                <span class="chip ${t.payment_status === 'Paid' ? 'paid' : 'pending'}">${t.payment_status}</span>
                ${formatDate(t.payment_date)}
              </div>
            </div>
            <div class="txn-amount"><div class="amt debit">${formatINR(t.amount)}</div></div>
          </div>
          <div class="txn-actions">
            <a class="txn-action-link" href="reports.html?type=party&partyType=Contractor&party=${encodeURIComponent(t.contractor_name_snapshot)}">History</a>
            <button class="txn-action-link archive-btn" data-id="${t.id}">Archive</button>
          </div>`).join('');

        listCard.querySelectorAll('.archive-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Archive this payment? It will no longer show in lists or totals, but stays in the database.')) return;
            const ok = await archiveRecord(TABLE, btn.dataset.id);
            if (ok) loadList(); else showBanner(banner, 'Could not archive this record.', 'error');
          });
        });
      }
      [document.getElementById('filterSite'), document.getElementById('filterMode')].forEach(el => el.addEventListener('change', loadList));
      document.getElementById('searchBox').addEventListener('input', debounce(loadList, 300));
      loadList();
    })();
  </script>
</body>
</html>
